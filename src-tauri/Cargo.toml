[package]
name = "emran-desktop"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Emran prayer times for Windows and Linux"
default-run = "emran-desktop"

[lib]
name = "emran_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
emran-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
lewton = "0.10"
ogg = "0.9"
ropus = "0.12.18"
