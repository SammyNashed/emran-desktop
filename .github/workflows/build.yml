name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # The oldest supported base: an AppImage only runs on systems at least as new as its build machine.
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf file libfuse2
      - name: Compare prayer times with the Android app
        run: cargo test -p emran-core
      - name: Test audio decoding
        run: cargo test -p emran-desktop --lib
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Name the files
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/bundle/nsis/*-setup.exe "out/Emran-$version-windows-setup.exe"
          else
            cp target/release/bundle/appimage/*.AppImage "out/Emran-$version-linux.AppImage"
            cp target/release/bundle/deb/*.deb "out/Emran-$version-linux.deb"
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: emran-${{ runner.os }}
          path: out/*
          if-no-files-found: error
